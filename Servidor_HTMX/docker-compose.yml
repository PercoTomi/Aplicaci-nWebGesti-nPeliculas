services:
  db:
    image: postgres:15
    container_name: postgresTP6
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: tpe_parte_6
    ports:
      - "5432:5432"
    volumes:
      # Inicialización automática de tablas
      - ./internal/db/schema/schema.sql:/docker-entrypoint-initdb.d/schema.sql
